# =================================================================================================
# Project Details
# =================================================================================================
[project]
name = "py-blueprint"
version = "0.0.1"
description = "FastAPI hexagonal architecture blueprint (Ports & Adapters) with domain-driven structure, manual DI, structured logging, and testing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [{ name = "Shandryll Stéphano", email = "shandryll94@gmail.com" }]
keywords = ["blueprint", "template", "python"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# =================================================================================================
# Project Dependencies (Runtime only)
# =================================================================================================
dependencies = [
    "fastapi>=0.136.3",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "structlog>=25.5.0",
    "uvicorn>=0.49.0",
]

# =================================================================================================
# Optional Dependencies (Dev tools)
# =================================================================================================
[project.optional-dependencies]
dev = [
    "bandit>=1.9.4",
    "pre-commit>=4.3.0",
    "pyright>=1.1.410",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "requests>=2.32.0",
    "ruff>=0.15.16",
    "safety>=3.0.0",
]

# =================================================================================================
# uv Configuration
# =================================================================================================
[tool.uv]
package = true

# =================================================================================================
# Build System
# =================================================================================================
[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = { "" = "src" }

# =================================================================================================
# Ruff Config & Format
# =================================================================================================
[tool.ruff]
line-length = 120
target-version = "py312"
indent-width = 4
fix = true
show-fixes = true
exclude = [
    "venv",
    ".venv",
    "env",
    ".env",
    "__pycache__",
    ".git",
    "build",
    "dist",
    "*.egg-info",
    "**/node_modules",
    "**/.*",
]

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "ANN",  # flake8-annotations
    "B",    # flake8-bugbear
    "COM",  # flake8-commas
    "N",    # pep8-naming
    "D",    # pydocstyle
    "E",    # pycodestyle Error
    "F",    # pyflakes
    "I",    # isort
    "PLC",  # Pylint Convention
    "PLE",  # Pylint Error
    "PLR",  # Pylint Refactor
    "PLW",  # Pylint Warning
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle Warning
]

ignore = [
    "D100",    # undocumented-public-module
    "D101",    # undocumented-public-class
    "D102",    # undocumented-public-method (intentional - simplified code)
    "D103",    # undocumented-public-function (intentional - simplified code)
    "D104",    # undocumented-public-package
    "D105",    # undocumented-magic-method (intentional - simplified code)
    "D106",    # undocumented-public-nested-class
    "D107",    # undocumented-public-init
    "D203",    # one-blank-line-before-class
    "D204",    # incorrect-blank-line-after-class
    "D213",    # multi-line-summary-second-line
    "D413",    # missing-blank-line-after-last-section
    "PLR2004", # magic-value-comparison
    "PLE1205", # logging-too-many-args
    "COM812",  # trailing-comma-missing
    "B008",    # function-call-in-argument-default (FastAPI Depends é padrão válido)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN001", "ANN201", "S101"]

# =================================================================================================
# Pyright - Typing (Fixed)
# =================================================================================================
[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
include = ["src", "tests"]
exclude = [
    "**/venv",
    "**/.venv",
    "**/env",
    "**/.env",
    "**/__pycache__",
    "**/node_modules",
    "**/.*",
]

# =================================================================================================
# Pytest - Tests
# =================================================================================================
[tool.pytest.ini_options]
addopts = "-v --color=yes --tb=short"
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

